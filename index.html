<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chasse aux Orbes VR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; font-family: -apple-system, Arial, sans-serif; }
  a-scene { width:100vw; height:100vh; }

  #startOverlay {
    position:fixed; inset:0; z-index:20;
    background:radial-gradient(circle at center, #16213e 0%, #05070f 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; box-sizing:border-box;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  #startOverlay h1 { font-size:1.5rem; margin:0 0 12px; }
  #startOverlay p { font-size:0.95rem; line-height:1.5; max-width:340px; color:#c9d2e3; margin:0 0 20px; }
  .bigBtn {
    padding:16px 28px; font-size:1.05rem; border:none; border-radius:14px;
    background:#5b8cff; color:#fff; font-weight:600; box-shadow:0 6px 18px rgba(91,140,255,0.4);
    margin-bottom:12px; min-width:220px;
  }
  .bigBtn:active { transform:scale(0.97); }
  #iosPermBtn { display:none; background:#ff9f5b; box-shadow:0 6px 18px rgba(255,159,91,0.4); }

  #hud {
    position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:0; right:0;
    z-index:10; text-align:center; color:#fff; font-size:1.1rem;
    text-shadow:0 2px 6px rgba(0,0,0,0.8); pointer-events:none; font-weight:600;
  }

  #winOverlay {
    position:fixed; inset:0; z-index:20; display:none;
    background:rgba(5,7,15,0.92); color:#fff; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px; box-sizing:border-box;
  }
  #winOverlay h1 { font-size:1.8rem; margin:0 0 8px; }
  #winOverlay p { color:#c9d2e3; margin:0 0 20px; }
</style>
</head>
<body>

<div id="hud">Orbes : <span id="score">0</span> / <span id="total">8</span></div>

<div id="startOverlay">
  <h1>🥽 Chasse aux Orbes</h1>
  <p>Insère ton téléphone dans le boîtier cardboard après avoir lancé la VR.
  Regarde une orbe et fixe-la une seconde pour la collecter. Collecte les 8 orbes !</p>
  <button id="iosPermBtn" class="bigBtn">Activer les capteurs de mouvement</button>
  <button id="startBtn" class="bigBtn">Lancer le jeu</button>
</div>

<div id="winOverlay">
  <h1>🎉 Bravo !</h1>
  <p>Tu as collecté toutes les orbes.</p>
  <button id="restartBtn" class="bigBtn">Rejouer</button>
</div>

<a-scene vr-mode-ui="enterVRButton: #enterVRButton" embedded loading-screen="enabled:false" renderer="colorManagement:true">
  <a-assets>
    <img id="skyTex" crossorigin="anonymous" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiMwYTBlMWYiLz48L3N2Zz4=">
  </a-assets>

  <a-sky color="#0a0e1f"></a-sky>

  <!-- étoiles décoratives -->
  <a-entity id="stars"></a-entity>

  <a-entity id="rig" position="0 1.6 0">
    <a-camera id="cam" look-controls="reverseMouseDrag:false" wasd-controls-enabled="false">
      <a-entity cursor="fuse:true;fuseTimeout:1000"
                position="0 0 -1"
                geometry="primitive:ring;radiusInner:0.006;radiusOuter:0.011"
                material="color:#5b8cff;shader:flat;opacity:0.9"
                animation__click="property:scale;startEvents:click;from:1.4 1.4 1.4;to:1 1 1;dur:250">
      </a-entity>
    </a-camera>
  </a-entity>

  <a-entity id="orbContainer"></a-entity>

  <!-- sol pour repère visuel -->
  <a-entity geometry="primitive:circle;radius:20;segments:48"
             rotation="-90 0 0" position="0 0 0"
             material="color:#12172b;shader:flat;side:double">
  </a-entity>
</a-scene>

<script>
(function () {
  var TOTAL = 8;
  var collected = 0;
  var scoreEl = document.getElementById('score');
  document.getElementById('total').textContent = TOTAL;
  var scene = document.querySelector('a-scene');
  var container = document.getElementById('orbContainer');
  var starsEl = document.getElementById('stars');

  // Étoiles décoratives (statiques, esthétique)
  for (var s = 0; s < 60; s++) {
    var star = document.createElement('a-entity');
    var r = 15;
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.random() * Math.PI * 0.6 + 0.1;
    var x = r * Math.sin(phi) * Math.cos(theta);
    var y = r * Math.cos(phi) + 1;
    var z = r * Math.sin(phi) * Math.sin(theta);
    star.setAttribute('geometry', 'primitive:sphere;radius:0.03');
    star.setAttribute('material', 'color:#ffffff;shader:flat;opacity:' + (0.4 + Math.random()*0.6));
    star.setAttribute('position', x + ' ' + y + ' ' + z);
    starsEl.appendChild(star);
  }

  var colors = ['#ff6b6b', '#5bffb0', '#5b8cff', '#ffd15b', '#c85bff', '#5bf0ff', '#ff5bb0', '#a3ff5b'];

  function randomOrbPosition() {
    var radius = 2.6 + Math.random() * 1.4;
    var theta = Math.random() * Math.PI * 2;
    var phi = (Math.random() * 0.8 + 0.15) * Math.PI * 0.5; // évite trop haut/bas
    var x = radius * Math.sin(phi) * Math.cos(theta);
    var y = 1.6 + radius * Math.cos(phi) * 0.6;
    var z = radius * Math.sin(phi) * Math.sin(theta);
    return x + ' ' + Math.max(0.4, y) + ' ' + z;
  }

  function spawnOrb(index) {
    var orb = document.createElement('a-entity');
    orb.setAttribute('geometry', 'primitive:sphere;radius:0.22;segments-width:16;segments-height:16');
    orb.setAttribute('material', 'color:' + colors[index % colors.length] + ';shader:standard;emissive:' + colors[index % colors.length] + ';emissiveIntensity:0.5;metalness:0.1;roughness:0.3');
    orb.setAttribute('position', randomOrbPosition());
    orb.setAttribute('animation__float', 'property:position;dir:alternate;dur:2000;loop:true;easing:easeInOutSine;to:' + floatOffset(orb));
    orb.setAttribute('animation__spin', 'property:rotation;to:0 360 0;loop:true;dur:4000;easing:linear');
    orb.classList.add('collectible');

    orb.addEventListener('click', function onClick() {
      orb.removeEventListener('click', onClick);
      orb.setAttribute('animation__pop', 'property:scale;to:0 0 0;dur:220;easing:easeInBack');
      setTimeout(function () { container.removeChild(orb); }, 230);
      collected++;
      scoreEl.textContent = collected;
      if (collected >= TOTAL) {
        setTimeout(function () {
          document.getElementById('winOverlay').style.display = 'flex';
        }, 300);
      }
    });

    container.appendChild(orb);
  }

  function floatOffset(el) {
    var p = el.getAttribute('position');
    return p.x + ' ' + (p.y + 0.25) + ' ' + p.z;
  }

  function startGame() {
    collected = 0;
    scoreEl.textContent = 0;
    container.innerHTML = '';
    for (var i = 0; i < TOTAL; i++) spawnOrb(i);
    document.getElementById('winOverlay').style.display = 'none';
    document.getElementById('startOverlay').style.display = 'none';
  }

  // Permission gyroscope iOS 13+
  var needsIOSPermission = typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function';
  var iosBtn = document.getElementById('iosPermBtn');
  if (needsIOSPermission) {
    iosBtn.style.display = 'inline-block';
    iosBtn.addEventListener('click', function () {
      DeviceOrientationEvent.requestPermission().then(function (state) {
        if (state === 'granted') {
          iosBtn.style.display = 'none';
        }
      }).catch(function () {});
    });
  }

  document.getElementById('startBtn').addEventListener('click', function () {
    startGame();
    // tente d'entrer directement en mode VR (stéréo) si possible
    if (scene.hasLoaded) {
      scene.components['vr-mode-ui'] && scene.enterVR();
    } else {
      scene.addEventListener('loaded', function () { scene.enterVR(); });
    }
  });

  document.getElementById('restartBtn').addEventListener('click', function () {
    startGame();
  });
})();
</script>
</body>
</html>
