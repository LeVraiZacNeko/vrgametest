<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AR Mains - Cardboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AR Mains">
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; font-family:-apple-system, Arial, sans-serif; }
  #video { display:none; }
  #stage { position:fixed; inset:0; display:flex; }
  canvas.eye { width:50%; height:100%; background:#000; }
  #divider { position:fixed; top:0; bottom:0; left:50%; width:1px; background:rgba(255,255,255,0.15); z-index:5; }

  #overlay {
    position:fixed; inset:0; z-index:20;
    background:radial-gradient(circle at center, #16213e 0%, #05070f 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; box-sizing:border-box;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  #overlay h1 { font-size:1.4rem; margin:0 0 10px; }
  #overlay p { font-size:0.9rem; line-height:1.5; max-width:340px; color:#c9d2e3; margin:0 0 16px; }
  .bigBtn {
    padding:16px 28px; font-size:1.05rem; border:none; border-radius:14px;
    background:#5b8cff; color:#fff; font-weight:600; box-shadow:0 6px 18px rgba(91,140,255,0.4);
    margin-bottom:12px; min-width:240px;
  }
  .bigBtn:active { transform:scale(0.97); }
  #status { font-size:0.85rem; color:#8ea0c9; min-height:20px; }
  #errorMsg { color:#ff8080; font-size:0.85rem; max-width:320px; }
</style>
</head>
<body>

<video id="video" playsinline muted></video>

<div id="stage">
  <canvas id="leftEye" class="eye"></canvas>
  <canvas id="rightEye" class="eye"></canvas>
</div>
<div id="divider"></div>

<div id="overlay">
  <h1>🖐️ AR Mains (Cardboard)</h1>
  <p>
    Utilise la caméra arrière de ton téléphone pour voir tes mains en vrai,
    avec un squelette superposé en temps réel. Nécessite un boîtier cardboard
    avec une ouverture alignée sur l'objectif arrière.
  </p>
  <button id="startBtn" class="bigBtn">Démarrer la caméra</button>
  <p id="status"></p>
  <p id="errorMsg"></p>
</div>

<script type="module">
import {
  FilesetResolver,
  HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById('video');
const leftCanvas = document.getElementById('leftEye');
const rightCanvas = document.getElementById('rightEye');
const leftCtx = leftCanvas.getContext('2d');
const rightCtx = rightCanvas.getContext('2d');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('errorMsg');
const startBtn = document.getElementById('startBtn');

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];
const HAND_COLORS = ['#5bffb0', '#5b8cff'];

let handLandmarker = null;
let running = false;

function resizeCanvases() {
  const w = window.innerWidth / 2;
  const h = window.innerHeight;
  [leftCanvas, rightCanvas].forEach(c => { c.width = w; c.height = h; });
}
window.addEventListener('resize', resizeCanvases);
resizeCanvases();

function drawEye(ctx, canvas, hands) {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  hands.forEach((landmarks, i) => {
    const color = HAND_COLORS[i % HAND_COLORS.length];
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.fillStyle = color;

    HAND_CONNECTIONS.forEach(([a, b]) => {
      const p1 = landmarks[a], p2 = landmarks[b];
      ctx.beginPath();
      ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
      ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
      ctx.stroke();
    });
    landmarks.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x * canvas.width, p.y * canvas.height, 5, 0, Math.PI * 2);
      ctx.fill();
    });
  });
  ctx.restore();
}

function renderLoop() {
  if (!running) return;
  if (handLandmarker && video.readyState >= 2) {
    const result = handLandmarker.detectForVideo(video, performance.now());
    const hands = result.landmarks || [];
    drawEye(leftCtx, leftCanvas, hands);
    drawEye(rightCtx, rightCanvas, hands);
  }
  requestAnimationFrame(renderLoop);
}

async function initModel() {
  statusEl.textContent = 'Chargement du modèle de détection de mains…';
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2
  });
}

async function startCamera() {
  statusEl.textContent = 'Accès à la caméra arrière…';
  errorEl.textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    errorEl.textContent = "Impossible d'accéder à la caméra : " + e.message;
    throw e;
  }
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  try {
    await startCamera();
    await initModel();
    overlay.style.display = 'none';
    running = true;
    requestAnimationFrame(renderLoop);
  } catch (e) {
    startBtn.disabled = false;
    statusEl.textContent = '';
    if (!errorEl.textContent) {
      errorEl.textContent = "Erreur au chargement : " + e.message;
    }
  }
});
</script>
</body>
</html>
